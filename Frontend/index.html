    <!-- Instant First Paint Critical CSS: Zero white flash, instant open on slow network -->
    <style>
      html, body {
        background-color: #050505 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      #root {
        background-color: #050505;
        min-height: 100vh;
        min-height: 100dvh;
      }
      @keyframes bmTopLoader {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(120%); }
      }
      .bm-initial-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: rgba(255, 107, 30, 0.12);
        overflow: hidden;
        z-index: 100000;
      }
      .bm-initial-progress {
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ff6b1e, #ff9e58, transparent);
        animation: bmTopLoader 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .bm-initial-nav {
        height: 76px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        background: #050505;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

        height: 36px;
        width: 36px;

      }
    </style>
