# ══════════════════════════════════════════════════════════════
# Nginx Configuration for Brandmingo (brandmingo.in) on VPS
# Separate Frontend (Port 3006) and Backend (Port 5006)
# Location: /etc/nginx/sites-available/brandmingo
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name brandmingo.in www.brandmingo.in;

    # Allow up to 25MB file uploads for rich blog images
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Backend API Proxy (Forwarded to Express on port 5006) ──
    location /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Backend Health Check ──
    location /health {
        proxy_pass http://127.0.0.1:5006/health;
        proxy_set_header Host $host;
    }

    # ── Frontend Proxy (Forwarded to Vite / PM2 on port 3006) ──
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
