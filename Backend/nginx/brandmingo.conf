# ══════════════════════════════════════════════════════════════
# Nginx Configuration for Brandmingo (brandmingo.in) on VPS
# Ultra-Fast Architecture: Direct Static Serving (Nginx Kernel Sendfile)
# Location: /etc/nginx/sites-available/brandmingo
# ══════════════════════════════════════════════════════════════

# 1. HTTP to HTTPS Auto-Redirect
server {
    listen 80;
    listen [::]:80;
    server_name brandmingo.in www.brandmingo.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://brandmingo.in$request_uri;
    }
}

# 2. Redirect www to non-www (SEO Best Practice)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.brandmingo.in;

    ssl_certificate /etc/letsencrypt/live/brandmingo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandmingo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://brandmingo.in$request_uri;
}

# 3. Main Server Block (Direct Static Serving + API Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brandmingo.in;

    # Direct static files root (Zero CPU, C-speed!)
    root /var/www/BM/Frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/brandmingo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandmingo.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 1. Static Assets Caching (1 Year Cache - 0ms repeat load!) ──
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── 2. Backend API Proxy (Port 5006) ──
    location /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── 3. Health Check ──
    location /health {
        proxy_pass http://127.0.0.1:5006/health;
        proxy_set_header Host $host;
    }

    # ── 4. SPA Direct Route Fallback (Native Nginx) ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
