# ══════════════════════════════════════════════════════════════
# Nginx Configuration for Brandmingo on Ubuntu/Debian VPS
# Location on VPS: /etc/nginx/sites-available/brandmingo
# Symlink: ln -s /etc/nginx/sites-available/brandmingo /etc/nginx/sites-enabled/
# ══════════════════════════════════════════════════════════════

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name brandmingo.com www.brandmingo.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://brandmingo.com$request_uri;
    }
}

# 2. Redirect HTTPS www to non-www (SEO Best Practice)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.brandmingo.com;

    # SSL certificates (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/brandmingo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandmingo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://brandmingo.com$request_uri;
}

# 3. Main Server Block (brandmingo.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brandmingo.com;

    # Root directory pointing to the Frontend build
    # Adjust path according to where your project is cloned (e.g. /var/www/brandmingo/Frontend/dist or /var/www/brandmingo/Backend/dist)
    root /var/www/brandmingo/Backend/dist;
    index index.html;

    # SSL certificates (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/brandmingo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandmingo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max body size (Allows up to 25MB file uploads for rich blog images)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static Assets Caching (1 Year Cache) ──
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Backend API Proxy (Forwarded to Express on port 5000) ──
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for heavy uploads/requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Backend Health Check ──
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }

    # ── SPA Frontend Routing Fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
